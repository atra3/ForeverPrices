name: Publish prices

on:
  schedule:
    # Retry opportunities if GitHub delays or drops a scheduled trigger.
    # The publish gate below allows one release per two-hour UTC window.
    - cron: '17,37,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-prices
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check whether a release is due
        id: due
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            LAST_RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false) | .published_at] | max // empty')
            if [[ -n "$LAST_RELEASE" ]]; then
              LAST_PUBLISHED=$(date -u -d "$LAST_RELEASE" +%s)
              NOW=$(date -u +%s)
              LAST_WINDOW=$(( LAST_PUBLISHED / 7200 ))
              CURRENT_WINDOW=$(( NOW / 7200 ))
              if (( LAST_WINDOW >= CURRENT_WINDOW )); then
                echo "A release has already been published in this two-hour UTC window." >> "$GITHUB_STEP_SUMMARY"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.due.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Fetch prices
        if: steps.due.outputs.publish == 'true'
        run: node tools/build.js
      - name: Package
        if: steps.due.outputs.publish == 'true'
        id: package
        shell: bash
        run: |
          VERSION="1.0.$(date -u +%Y%m%d%H%M%S).${GITHUB_RUN_ATTEMPT}"
          sed -i "s/^## Version:.*/## Version: $VERSION/" ForeverPrices.toc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Prices.lua ForeverPrices.toc
          git commit -m "Prices $VERSION"
          git push
          mkdir -p dist/ForeverPrices
          cp ForeverPrices.toc ForeverPrices.lua Prices.lua dist/ForeverPrices/
          cd dist
          zip -q -r "ForeverPrices-$VERSION.zip" ForeverPrices
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Release
        if: steps.due.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/ForeverPrices-$VERSION.zip" \
            --target "$(git rev-parse HEAD)" --title "Forever Prices $VERSION" \
            --notes "US Forever PvP Horde prices from Undermine Exchange." --latest
